name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "book/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: pandoc/actions/setup@main
        with:
          version: 3.7.0.2

      - name: Prepare TeX Live cache directory
        run: sudo mkdir -p /usr/local/texlive && sudo chown -R $(whoami) /usr/local/texlive

      - name: Cache TeX Live
        uses: actions/cache@v4
        id: cache-texlive
        with:
          path: /usr/local/texlive
          key: texlive-macos-${{ hashFiles('.github/workflows/pages.yml') }}

      - name: Install brew dependencies
        run: |
          brew install make
          brew install pandoc-crossref
          brew install poppler
          if [ "${{ steps.cache-texlive.outputs.cache-hit }}" != "true" ]; then
            brew install --cask basictex
            eval "$(/usr/libexec/path_helper)"
            sudo tlmgr update --self
            sudo tlmgr install collection-fontsrecommended collection-latexextra standalone xetex collection-xetex
          fi

      - name: Set up LaTeX PATH
        run: |
          TEXLIVE_BIN=$(find /usr/local/texlive -type d -name "bin" -exec find {} -type d -name "*-darwin" \; 2>/dev/null | head -1)
          echo "$TEXLIVE_BIN" >> $GITHUB_PATH
          echo "/Library/TeX/texbin" >> $GITHUB_PATH

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Clean build directory
        run: rm -rf build && mkdir -p build/html

      - name: Build book (HTML and PDF)
        run: make html && make pdf && make epub && make kindle && make files

      - name: Build Pagefind search index
        run: npx --yes pagefind --site build/html --glob "c/**/*.html"

      - name: Fix absolute paths for GitHub Pages subpath
        run: |
          find build/html -name "*.html" -exec sed -i '' \
            -e 's|href="/pagefind/|href="/rlhf-book-ko/pagefind/|g' \
            -e 's|src="/pagefind/|src="/rlhf-book-ko/pagefind/|g' \
            {} +

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
