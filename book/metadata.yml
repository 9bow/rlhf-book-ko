abstract: |
  인간 피드백 기반 강화학습(RLHF)은 최신 머신러닝 시스템을 배포하기 위한 중요한 기술적·서사적 도구로 자리 잡았습니다.
  이 책에서는 정량적 배경 지식을 갖춘 독자를 대상으로 핵심 방법론을 친절하게 소개합니다.
  RLHF의 기원부터 시작하여 경제학, 철학, 최적 제어 등 다양한 분야가 어떻게 수렴했는지 살펴봅니다.
  이어서 정의, 문제 공식화, 데이터 수집, 문헌에서 자주 쓰이는 수학적 표현을 소개합니다.
  책의 핵심은 RLHF의 각 최적화 단계로, 지시 튜닝 시작부터 보상 모델 학습, 그리고 거부 샘플링·강화학습·직접 정렬 알고리즘까지 다룹니다.
  마지막으로 합성 데이터와 평가 분야의 미개척 연구 주제와 분야의 열린 질문들을 다룹니다.
