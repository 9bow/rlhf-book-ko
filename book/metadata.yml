abstract: |
  인간 피드백 기반 강화학습(RLHF)은 최신 머신러닝 시스템을 대규모로 구축하기 위한 핵심 도구가 되었습니다.
  이 분야는 RLHF의 핵심 방법론을 중심으로 성장해 오늘날의 더 넓은 사후 학습(post-training) 기법 모음으로 확장되었습니다.
  이 책은 정량적 배경 지식을 갖춘 독자를 위해, 정석적인 RLHF 레시피를 중심으로 모델 사후 학습의 핵심 방법을 종합적으로 소개합니다.
  먼저 RLHF가 무엇을 하는지, 왜 만들어졌는지, 짧은 역사 속 주요 기술적 이정표와 책을 이해하는 데 필요한 강화학습 배경을 다룹니다.
  책의 핵심부는 RLHF의 각 최적화 단계를 설명하며, 지시 미세조정에서 시작해 보상 모델 학습, 거부 샘플링, 강화학습, 온-정책 증류, 직접 정렬 알고리즘까지 다룹니다.
  또한 최근 문헌뿐 아니라 경제학, 철학, 최적 제어 등 여러 과학 분야의 수렴이라는 관점에서 RLHF의 기원도 논의합니다.
  마지막으로 합성 데이터, 도구 사용, 캐릭터 학습, 평가에서의 미개척 또는 새롭게 떠오르는 연구 질문과 분야의 열린 문제를 다룹니다.
  이 책은 [코드베이스](https://rlhfbook.com/code), 사후 학습 단계별 모델 완성을 비교하는 [라이브러리](https://rlhfbook.com/library), 교육용 [강좌](https://rlhfbook.com/course) 등 다양한 보조 자료와 함께 공개되어, 언어 모델 사후 학습의 기초 개념을 한곳에서 배울 수 있도록 구성되었습니다.
